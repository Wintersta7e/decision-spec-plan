name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q jq shellcheck
          pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check skills/decision-spec-plan/scripts
          ruff format --check skills/decision-spec-plan/scripts
          pyright
          shellcheck -S warning skills/decision-spec-plan/tests/hooks_test.sh
      - name: Hook and checker suite
        run: skills/decision-spec-plan/tests/hooks_test.sh
