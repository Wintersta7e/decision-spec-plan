name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check skills/decision-spec-plan/scripts skills/decision-spec-plan/tests
          ruff format --check skills/decision-spec-plan/scripts skills/decision-spec-plan/tests
          pyright
      - name: Hook and checker suite
        run: python3 -m unittest discover -s skills/decision-spec-plan/tests
