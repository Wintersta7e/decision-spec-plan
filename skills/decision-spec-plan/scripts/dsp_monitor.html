<style>
:root {
  color-scheme: light;
  --bg: #fafafa; --fg: #1d1d1f; --muted: #55555f; --card: #ffffff; --line: #d0d0d8;
  --ok: #1a7f37; --warn: #8a5a00; --bad: #c41d2a; --info: #0b5cc4; --focus: #0b5cc4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) {
    color-scheme: dark;
    --bg: #16171a; --fg: #e8e8ec; --muted: #a8a8b3; --card: #1f2125; --line: #3a3d44;
    --ok: #4ac26b; --warn: #e3b341; --bad: #ff7b72; --info: #6cb6ff; --focus: #6cb6ff;
  }
}
:root[data-theme=dark] {
  color-scheme: dark;
  --bg: #16171a; --fg: #e8e8ec; --muted: #a8a8b3; --card: #1f2125; --line: #3a3d44;
  --ok: #4ac26b; --warn: #e3b341; --bad: #ff7b72; --info: #6cb6ff; --focus: #6cb6ff;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
a { color: var(--info); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button {
  font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line);
  border-radius: 6px; padding: 0.2rem 0.6rem; cursor: pointer; transition: background-color 0.15s;
}
button:hover { background: var(--bg); }
#head {
  display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 1rem;
  border-bottom: 1px solid var(--line); background: var(--card);
}
#head .title { font-weight: 600; font-size: 1.1rem; color: var(--fg); text-decoration: none; }
#head .updated { color: var(--muted); margin-right: auto; }
#banners .banner { margin: 0; padding: 0.5rem 1rem; font-weight: 600; border-bottom: 1px solid var(--line); }
#banners .banner[data-banner=down] { color: var(--bad); }
#banners .banner[data-banner=upgraded] { color: var(--info); }
#sheet { margin: 0.75rem 1rem; padding: 0.5rem 1rem; border: 1px solid var(--line); background: var(--card); }
kbd { font-family: ui-monospace, monospace; font-size: 0.9em; padding: 0 0.3rem; border: 1px solid var(--line); border-radius: 4px; }
.ended { margin-bottom: 1.25rem; }
.ended h3 { margin-bottom: 0.1rem; }
main { padding: 0.75rem 1rem 2rem; max-width: 1400px; }
h2 { font-size: 1rem; margin: 1rem 0 0.4rem; }
.band ul { list-style: none; margin: 0; padding: 0; }
.band li { padding: 0.3rem 0.6rem; margin: 0.25rem 0; border-left: 4px solid var(--line); background: var(--card); }
.band li[data-severity=red] { border-left-color: var(--bad); }
.band li[data-severity=amber] { border-left-color: var(--warn); }
.band.waiting li { border-left-color: var(--info); }
.empty, .scanning { color: var(--muted); margin: 0.25rem 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 0.75rem; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 0.6rem 0.8rem; }
.card .name { font-weight: 600; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 0.1rem 0.75rem; margin: 0.4rem 0; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 0.3rem; }
.chip {
  display: inline-flex; gap: 0.3rem; align-items: baseline; padding: 0 0.45rem;
  border: 1px solid var(--line); border-radius: 999px; color: var(--fg); font-size: 0.9em;
}
.chip .glyph { font-weight: 700; }
[data-enum][data-v=seen], [data-enum][data-v=fresh], [data-enum][data-v=done],
[data-enum][data-v=merged], [data-enum][data-v=green], [data-enum][data-v=returned] { color: var(--ok); border-color: currentColor; }
[data-enum][data-v=reduced], [data-enum][data-v=slow], [data-enum][data-v=git-slow],
[data-enum][data-v=stuck], [data-enum][data-v=flag], [data-enum][data-v=unreadable],
[data-enum][data-v=dirty], [data-enum][data-v=gating] { color: var(--warn); border-color: currentColor; }
[data-enum][data-v=blind], [data-enum][data-v=dir-missing], [data-enum][data-v=red],
[data-enum][data-v=failed], [data-enum][data-v=lost], [data-enum][data-v=blocked] { color: var(--bad); border-color: currentColor; }
[data-enum][data-v=asked], [data-enum][data-v=input], [data-enum][data-v=running],
[data-enum][data-v=active], [data-enum][data-v=current], [data-enum][data-v=live] { color: var(--info); border-color: currentColor; }
[data-enum][data-v=none], [data-enum][data-v=expired], [data-enum][data-v=not_tracked] { color: var(--muted); }
.idle-list { list-style: none; margin: 0.3rem 0 0; padding: 0; }
.idle-list li { padding: 0.15rem 0; }
.idle-list .when { color: var(--muted); margin-left: 0.5rem; }
.more { display: flex; flex-wrap: wrap; gap: 1rem; align-items: baseline; margin-top: 1rem; }
h3 { font-size: 0.95rem; margin: 1.1rem 0 0.4rem; }
.detail-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.4rem 1rem; }
.detail-head h2 { margin: 0.5rem 0; }
.when, .muted { color: var(--muted); }
.hint, .error { margin: 0.3rem 0; }
.error { color: var(--bad); }
.mono { font-family: ui-monospace, monospace; font-size: 0.88em; overflow-wrap: anywhere; }
.stages { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0.4rem; }
.stages li {
  display: inline-flex; gap: 0.35rem; align-items: baseline; padding: 0.15rem 0.5rem;
  border: 1px solid var(--line); border-radius: 6px; background: var(--card);
}
.stages .glyph { font-weight: 700; }
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(150px, 1fr); gap: 0.5rem; overflow-x: auto; }
.board .col { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 0.4rem; min-height: 4rem; }
.board h4 { margin: 0 0 0.4rem; font-size: 0.9rem; display: flex; gap: 0.3rem; align-items: baseline; }
.lane { border: 1px solid var(--line); border-radius: 6px; padding: 0.3rem 0.45rem; margin: 0 0 0.35rem; background: var(--bg); }
.lane .plan { font-weight: 600; margin-right: 0.4rem; }
.lane .chips { margin-top: 0.25rem; }
.badge { color: var(--warn); border-color: currentColor; }
.graph { position: relative; }
.graph svg { display: block; max-width: 100%; height: auto; }
.graph .node { fill: var(--card); stroke: var(--line); }
.graph .edge, .graph .bracket { fill: none; stroke: var(--muted); stroke-width: 1.5px; }
.graph .bracket { stroke: var(--line); }
.graph text { fill: var(--fg); font-size: 13px; }
.graph text.head { fill: var(--muted); font-weight: 600; }
.graph tspan[data-enum] { fill: currentColor; }
.sr-table { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.table-wrap { overflow-x: auto; }
table.grid { border-collapse: collapse; width: 100%; background: var(--card); }
table.grid th, table.grid td { text-align: left; padding: 0.25rem 0.5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
table.grid th { color: var(--muted); font-weight: 600; }
tr.maybe-stuck { outline: 2px dashed var(--warn); outline-offset: -2px; }
.maybe-stuck .note { color: var(--warn); font-weight: 600; margin-left: 0.4rem; }
@media (max-width: 720px) {
  #head { flex-wrap: wrap; }
  .cards { grid-template-columns: 1fr; }
  .board { grid-auto-flow: row; grid-auto-columns: auto; }
  .graph svg { display: none; }
  .graph .sr-table { position: static; width: auto; height: auto; overflow: visible; clip-path: none; white-space: normal; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>

    "do_open": "open the focused item",

    "do_help": "show or hide this sheet"
  }
} /* /dsp:labels */;
const PAGE = /* dsp:page */ {
  "poll_visible_ms": 5000,
  "poll_hidden_ms": 30000,
  "abort_ms": 10000,
  "backoff_ms": [5000, 10000, 20000, 30000],
  "finished_shown": 20
} /* /dsp:page */;
const copy = LABELS.copy;
const SVG_NS = "http://www.w3.org/2000/svg";
const URL_ATTRS = ["src", "href", "xlink:href", "action", "formaction", "srcset", "poster", "data"];
const THEMES = ["auto", "light", "dark"];
const THEME_TEXT = {auto: copy.theme_auto, light: copy.theme_light, dark: copy.theme_dark};
const THEME_KEY = "dsp-monitor-theme";
const ROUTE_PREFIX = "#/r/";
const RUN_PREFIX = "#/run/";
const ENDED_HASH = "#/ended";
/* the wave graph's layout, in SVG user units */
const GRAPH = {col: 190, node_w: 150, node_h: 40, gap: 12, pad: 40, head: 28, bend: 36,
  bracket: 8, radius: 6, text_x: 10, line1: 17, line2: 33};

const poll = {timer: 0, busy: false, failures: 0, failedAt: null, text: "", state: null, first: null};
const ui = {expanded: new Set(), updated: null, theme: null, help: null};
/* run key -> {rev, body, busy, failed}: an ended run's /api/run answer and the rev it was fetched at */
const runs = new Map();

/* An element with attributes and children; a string child becomes its text. URLs are
   set only by link(), so this never writes a URL attribute. */
function el(tag, attrs, children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (URL_ATTRS.includes(k)) {
      throw new TypeError(k);
    }
    if (v !== null && v !== undefined && v !== false) {
      node.setAttribute(k, v === true ? "" : String(v));
    }
  }
  if (typeof children === "string") {
    node.textContent = children;
  } else {
    for (const c of children || []) {
      if (c !== null && c !== undefined) {
        node.append(typeof c === "string" ? el("span", {}, c) : c);
      }
    }
  }
  return node;
}

/* A same-page link to the view at #/<path>. */
function link(path, children, key) {
  const a = el("a", {"data-key": key}, children);
  a.setAttribute("href", "#/" + path);
  return a;
}

function label(enumName, value) {
  const labels = LABELS[enumName] || {};
  return Object.hasOwn(labels, value) ? labels[value] : null;
}

/* A state as glyph and text, styled by data-enum/data-v; an unknown value shows raw. */
function chip(enumName, value) {
  const lab = label(enumName, value);
  return el("span", {"class": "chip", "data-enum": enumName, "data-v": value}, [
    lab ? el("span", {"class": "glyph", "aria-hidden": "true"}, lab.glyph) : null,
    el("span", {}, lab ? lab.text : String(value)),
  ]);
}

function fmt(template, vars) {
  let out = template;
  for (const [k, v] of Object.entries(vars || {})) {
    out = out.split("{" + k + "}").join(String(v));
  }
  return out;
}

function shown(value) {
  return value === null || value === undefined ? copy.missing : String(value);
}

function hhmm(iso) {
  if (!iso) {
    return copy.missing;
  }
  return new Date(iso).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
}

function age(iso, nowMs) {
  if (!iso) {
    return copy.missing;
  }
  const s = Math.max(0, Math.round((nowMs - Date.parse(iso)) / 1000));
  if (s < 60) {
    return fmt(copy.age_s, {n: s});
  }
  if (s < 3600) {
    return fmt(copy.age_m, {n: Math.floor(s / 60)});
  }
  if (s < 86400) {
    return fmt(copy.age_h, {n: Math.floor(s / 3600)});
  }
  return fmt(copy.age_d, {n: Math.floor(s / 86400)});
}

function ratio(done, total) {
  return done === null || done === undefined || total === null || total === undefined
    ? copy.missing
    : fmt(copy.ratio, {done: done, total: total});
}

function itemKey(item) {
  return [item.run, item.kind, item.subject || ""].join(":");
}

/* --- theme */

function storedTheme() {
  const t = localStorage.getItem(THEME_KEY);
  return THEMES.includes(t) ? t : THEMES[0];
}

function applyTheme(t) {
  if (t === THEMES[0]) {
    document.documentElement.removeAttribute("data-theme");
  } else {
    document.documentElement.setAttribute("data-theme", t);
  }
  if (ui.theme) {
    ui.theme.textContent = fmt(copy.theme, {theme: THEME_TEXT[t]});
  }
}

function cycleTheme() {
  const t = THEMES[(THEMES.indexOf(storedTheme()) + 1) % THEMES.length];
  localStorage.setItem(THEME_KEY, t);
  applyTheme(t);
}

/* --- header, sheet and banners */

function toggleSheet() {
  const sheet = document.getElementById("sheet");
  sheet.hidden = !sheet.hidden;
  ui.help.setAttribute("aria-expanded", String(!sheet.hidden));
}

function buildHeader() {
  const head = document.getElementById("head");
  const title = link("", copy.title, "home");
  title.setAttribute("class", "title");
  ui.updated = el("span", {"class": "updated"}, "");
  const refresh = el("button", {"type": "button"}, copy.refresh);
  refresh.addEventListener("click", refreshNow);
  ui.theme = el("button", {"type": "button"}, "");
  ui.theme.addEventListener("click", cycleTheme);
  ui.help = el("button", {"type": "button", "aria-label": copy.help_label, "aria-expanded": "false"}, copy.help);
  ui.help.addEventListener("click", toggleSheet);
  head.replaceChildren(title, ui.updated, refresh, ui.theme, ui.help);
  const lines = [
    [copy.key_overview, copy.do_overview], [copy.key_ended, copy.do_ended], [copy.key_route, copy.do_route],
    [copy.key_move, copy.do_move], [copy.key_open, copy.do_open], [copy.key_refresh, copy.do_refresh],
    [copy.key_theme, copy.do_theme], [copy.help, copy.do_help],
  ];
  document.getElementById("sheet").replaceChildren(el("h2", {}, copy.help_label), el("dl", {"class": "facts keys"},
    lines.flatMap(([k, what]) => [el("dt", {}, [el("kbd", {}, k)]), el("dd", {}, what)])));
}

function renderChrome() {
  const s = poll.state;
  ui.updated.textContent = s ? fmt(copy.updated, {age: age(s.generated_at, Date.now())}) : "";
  const banners = [];
  if (poll.failures) {
    banners.push(el("p", {"class": "banner", "data-banner": "down"}, fmt(copy.not_responding, {
      since: hhmm(poll.failedAt),
      data_from: s ? hhmm(s.generated_at) : copy.missing,
    })));
  }
  if (s && poll.first && (s.version !== poll.first.version || s.page !== poll.first.page)) {
    banners.push(el("p", {"class": "banner", "data-banner": "upgraded"}, copy.upgraded));
  }
  document.getElementById("banners").replaceChildren(...banners);
  document.title = s && s.counts.waiting ? fmt(copy.tab_title, {n: s.counts.waiting}) : copy.title;
}

/* --- the overview */

function band(cls, heading, items, entry) {
  return el("section", {"class": "band " + cls}, [
    el("h2", {}, heading),
    el("ul", {}, items.map(entry)),
  ]);
}

function fact(name, value) {
  return [el("dt", {}, name), el("dd", {}, shown(value))];
}

function card(r, nowMs) {
  const run = r.run;
  const sum = run.summary;
  const stage = sum.stage === null ? null : label("stage", sum.stage);
  const facts = [
    ...fact(copy.rung, run.report ? run.report.rung : null),
    ...fact(copy.stage, stage ? stage.text : sum.stage),
    ...fact(copy.waves, ratio(sum.waves_merged, sum.waves_total)),
    ...fact(copy.lanes, ratio(sum.lanes_merged, sum.lanes_total)),
    ...(run.budget ? fact(copy.budget_recorded, run.budget.label) : []),
    ...fact(copy.agents_running, sum.agents_running),
    ...fact(copy.last_active, age(r.last_activity_at, nowMs)),
  ];
  return el("article", {"class": "card"}, [
    link("r/" + encodeURIComponent(r.key), [el("span", {"class": "name"}, r.name)], r.key),
    el("dl", {"class": "facts"}, facts),
    el("div", {"class": "chips"}, [
      chip("recording", run.recording),
      chip("git_state", run.git.state),
      ...run.attention.map((a) => chip("attention", a.kind)),
    ]),
  ]);
}

function idleRow(s, nowMs) {
  const open = ui.expanded.has("idle-row");
  const button = el("button", {"type": "button", "aria-expanded": String(open), "data-key": "idle-row"},
    fmt(copy.idle_row, {n: s.counts.idle}));
  const list = el("ul", {"class": "idle-list", "hidden": !open}, s.idle.map((r) => el("li", {}, [
    link("r/" + encodeURIComponent(r.key), r.name, r.key),
    el("span", {"class": "when"}, age(r.last_activity_at, nowMs)),
  ])));
  button.addEventListener("click", () => {
    const now = list.hidden;
    list.hidden = !now;
    button.setAttribute("aria-expanded", String(now));
    if (now) {
      ui.expanded.add("idle-row");
    } else {
      ui.expanded.delete("idle-row");
    }
  });
  return el("div", {}, [button, list]);
}

function renderOverview(s, root) {
  const nowMs = Date.now();
  if (!s.ready) {
    root.append(el("p", {"class": "scanning"}, copy.scanning));
  }
  const waiting = band("waiting", copy.waiting_heading, s.waiting, (item) =>
    el("li", {}, [link("r/" + encodeURIComponent(item.route), item.text, itemKey(item))]));
  if (!s.waiting.length) {
    waiting.append(el("p", {"class": "empty"}, copy.waiting_empty));
  }
  root.append(waiting);
  if (s.attention.length) {
    root.append(band("attention", copy.attention_heading, s.attention, (item) =>
      el("li", {"data-severity": item.severity}, [
        chip("attention", item.kind), " ",
        link("r/" + encodeURIComponent(item.route), item.text, itemKey(item)),
      ])));
  }
  root.append(el("h2", {}, copy.routes_heading));
  root.append(s.routes.length
    ? el("div", {"class": "cards"}, s.routes.map((r) => card(r, nowMs)))
    : el("p", {"class": "empty"}, copy.routes_empty));
  root.append(el("div", {"class": "more"}, [
    s.idle.length ? idleRow(s, nowMs) : null,
    link("ended", fmt(copy.ended_link, {n: s.counts.ended}), "ended"),
  ]));
}

/* --- route detail: what the server sent for one run, laid out */

/* An SVG element; like el(), it never writes a URL attribute. */
function svg(tag, attrs, text) {
  const node = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (URL_ATTRS.includes(k)) {
      throw new TypeError(k);
    }
    node.setAttribute(k, String(v));
  }
  if (text !== undefined) {
    node.textContent = text;
  }
  return node;
}

function chipOr(enumName, value) {
  return value === null || value === undefined ? el("span", {"class": "chip"}, copy.missing) : chip(enumName, value);
}

function stamp(iso) {
  if (!iso) {
    return copy.missing;
  }
  return new Date(iso).toLocaleString([], {dateStyle: "medium", timeStyle: "short"});
}

function dur(s) {
  if (s === null || s === undefined) {
    return copy.missing;
  }
  if (s < 60) {
    return fmt(copy.dur_s, {n: Math.round(s)});
  }
  if (s < 3600) {
    return fmt(copy.dur_m, {n: Math.round(s / 60)});
  }
  return fmt(copy.dur_h, {n: (s / 3600).toFixed(1)});
}

function cmp(x, y) {
  return (x > y) - (x < y);
}

function grid(cls, heads, rows) {
  return el("div", {"class": "table-wrap " + cls}, [el("table", {"class": "grid"}, [
    el("thead", {}, [el("tr", {}, heads.map((h) => el("th", {"scope": "col"}, h)))]),
    el("tbody", {}, rows),
  ])]);
}

/* The chips every run shows: recording, git with the time its facts are from, and for an
   ended run whose report was read from today's files, the time of those files. */
function runChips(run) {
  return [
    chip("recording", run.recording),
    chip("git_state", run.git.state),
    run.git.as_of ? el("span", {"class": "when"}, fmt(copy.as_of, {time: hhmm(run.git.as_of)})) : null,
    run.current_files ? el("span", {"class": "chip"}, fmt(copy.current_files, {time: stamp(run.files_as_of)})) : null,
  ];
}

/* The stages in LABELS.stage order; a stage name the labels lack follows, raw. */
function stageStrip(stages) {
  const order = Object.keys(LABELS.stage);
  const sorted = [
    ...order.flatMap((k) => stages.filter((st) => st.name === k)),
    ...stages.filter((st) => !order.includes(st.name)),
  ];
  return el("ol", {"class": "stages"}, sorted.map((st) => {
    const name = label("stage", st.name);
    const state = label("stage_state", st.state);
    return el("li", {"data-enum": "stage_state", "data-v": st.state}, [
      state ? el("span", {"class": "glyph", "aria-hidden": "true"}, state.glyph) : null,
      el("span", {}, name ? name.text : String(st.name)),
      el("span", {"class": "muted"}, state ? state.text : String(st.state)),
    ]);
  }));
}

function budgetPanel(b) {
  return el("section", {"class": "budget"}, [
    el("h3", {}, copy.budget_recorded),
    b
      ? el("dl", {"class": "facts"}, [
        ...fact(copy.budget_label, b.label),
        ...fact(copy.budget_estimate, b.estimate),
        ...fact(copy.budget_groups, b.groups),
        ...fact(copy.budget_at, stamp(b.at)),
      ])
      : el("p", {"class": "empty"}, copy.budget_none),
  ]);
}

function laneCard(lane, waves, lanes) {
  const wave = Object.hasOwn(waves, lane.plan) ? waves[lane.plan].wave : null;
  const gating = Object.hasOwn(lanes, lane.id) && lanes[lane.id].gating;
  return el("article", {"class": "lane"}, [
    el("span", {"class": "plan"}, shown(lane.plan)),
    el("span", {"class": "muted"}, wave === null ? copy.missing : fmt(copy.wave_n, {n: wave})),
    el("div", {"class": "chips"}, [
      chipOr("gate", lane.gate),
      gating ? el("span", {"class": "chip badge"}, copy.gating_badge) : null,
    ]),
  ]);
}

/* One column per BOARD_COLUMNS value, in the labels' order; a lane sits where run.lanes puts it. */
function laneBoard(rep, lanes) {
  if (!rep.lanes.length) {
    return el("p", {"class": "empty"}, copy.board_empty);
  }
  const cols = Object.keys(LABELS.board_column);
  const by = new Map();
  for (const lane of rep.lanes) {
    const col = Object.hasOwn(lanes, lane.id) ? lanes[lane.id].column : copy.missing;
    if (!cols.includes(col)) {
      cols.push(col);
    }
    by.set(col, [...(by.get(col) || []), lane]);
  }
  return el("div", {"class": "board"}, cols.map((col) => {
    const cards = by.get(col) || [];
    const lab = label("board_column", col);
    return el("section", {"class": "col"}, [
      el("h4", {"data-enum": "board_column", "data-v": col}, [
        lab ? el("span", {"class": "glyph", "aria-hidden": "true"}, lab.glyph) : null,
        el("span", {}, lab ? lab.text : String(col)),
        el("span", {"class": "muted"}, fmt(copy.column_count, {n: cards.length})),
      ]),
      ...cards.map((lane) => laneCard(lane, rep.waves, lanes)),
    ]);
  }));
}

function curve(x1, y1, c1, c2, x2, y2) {
  return ["M", x1, y1, "C", c1, y1, c2, y2, x2, y2].join(" ");
}

/* Waves left to right (wave_no ascending, null last), an edge per "after" id and per
   "after_waves" entry, and the same facts as a table for narrow screens and screen readers. */
function waveGraph(rep, lanes) {
  const waves = rep.waves;
  const plans = Object.keys(waves);
  if (!plans.length) {
    return el("p", {"class": "empty"}, copy.graph_empty);
  }
  const g = GRAPH;
  const nos = [];
  for (const p of plans) {
    if (!nos.includes(waves[p].wave_no)) {
      nos.push(waves[p].wave_no);
    }
  }
  nos.sort((a, b) => (a === null) - (b === null) || a - b);
  const rows = nos.map(() => 0);
  const at = new Map();
  for (const p of plans) {
    const i = nos.indexOf(waves[p].wave_no);
    at.set(p, {x: g.pad + i * g.col, y: g.pad + g.head + rows[i] * (g.node_h + g.gap)});
    rows[i] += 1;
  }
  const columnsOf = new Map();
  for (const lane of rep.lanes) {
    const col = Object.hasOwn(lanes, lane.id) ? lanes[lane.id].column : null;
    columnsOf.set(lane.plan, [...(columnsOf.get(lane.plan) || []), col]);
  }
  const top = g.pad + g.head;
  const width = g.pad + nos.length * g.col;
  const height = top + Math.max(...rows) * (g.node_h + g.gap) + g.pad;
  const pic = svg("svg", {"viewBox": ["0 0", width, height].join(" "), "width": width, "height": height,
    "aria-hidden": "true", "focusable": "false"});
  const brackets = nos.map((no, i) => {
    const x = g.pad + i * g.col;
    const bottom = top + rows[i] * (g.node_h + g.gap) - g.gap;
    const spine = x + g.node_w + g.bracket;
    pic.append(svg("text", {"class": "head", "x": x, "y": g.pad}, no === null ? copy.missing : fmt(copy.wave_n, {n: no})));
    pic.append(svg("path", {"class": "bracket",
      "d": ["M", x + g.node_w, top, "H", spine, "V", bottom, "H", x + g.node_w].join(" ")}));
    return {x: spine, y: (top + bottom) * 0.5};
  });
  const mid = (y) => y + g.node_h * 0.5;
  for (const p of plans) {
    const t = at.get(p);
    for (const a of waves[p].after) {
      const f = at.get(a);
      if (f) {
        const d = f.x === t.x
          ? curve(f.x, mid(f.y), f.x - g.bend, t.x - g.bend, t.x, mid(t.y))
          : curve(f.x + g.node_w, mid(f.y), f.x + g.node_w + g.bend, t.x - g.bend, t.x, mid(t.y));
        pic.append(svg("path", {"class": "edge", "d": d}));
      }
    }
    for (const w of waves[p].after_waves) {
      const b = brackets[nos.indexOf(w)];
      if (b) {
        pic.append(svg("path", {"class": "edge", "d": curve(b.x, b.y, b.x + g.bend, t.x - g.bend, t.x, mid(t.y))}));
      }
    }
  }
  for (const p of plans) {
    const {x, y} = at.get(p);
    const node = svg("g", {});
    node.append(svg("rect", {"class": "node", "x": x, "y": y, "width": g.node_w, "height": g.node_h, "rx": g.radius}));
    node.append(svg("text", {"x": x + g.text_x, "y": y + g.line1}, p));
    const cols = svg("text", {"x": x + g.text_x, "y": y + g.line2});
    for (const col of columnsOf.get(p) || []) {
      const lab = label("board_column", col);
      cols.append(svg("tspan", {"data-enum": "board_column", "data-v": String(col)},
        (lab ? lab.glyph + " " + lab.text : shown(col)) + " "));
    }
    node.append(cols);
    pic.append(node);
  }
  const deps = (w) => [...w.after, ...w.after_waves.map((n) => fmt(copy.wave_n, {n: n}))].join(", ");
  return el("div", {"class": "graph"}, [
    pic,
    grid("sr-table", [copy.graph_plan, copy.graph_wave, copy.graph_after], plans.map((p) => el("tr", {}, [
      el("td", {}, p),
      el("td", {}, shown(waves[p].wave)),
      el("td", {}, deps(waves[p]) || copy.missing),
    ]))),
  ]);
}

function agentRow(a, nowMs) {
  return el("tr", {"class": a.likely_stuck ? "maybe-stuck" : null}, [
    el("td", {}, [shown(a.name), a.likely_stuck ? el("span", {"class": "note"}, copy.may_be_stuck) : null]),
    el("td", {}, [chipOr("agent_mode", a.mode)]),
    el("td", {}, [chipOr("agent_state", a.state)]),
    el("td", {}, shown(a.model)),
    el("td", {}, hhmm(a.started_at)),
    el("td", {}, dur(a.duration_s)),
    el("td", {}, shown(a.tools)),
    el("td", {}, a.last_tool === null ? copy.missing
      : [a.last_tool, " ", el("span", {"class": "when"}, age(a.last_tool_at, nowMs))]),
    el("td", {}, a.open_tool === null ? copy.missing
      : [a.open_tool, " ", el("span", {"class": "when"}, fmt(copy.since, {time: hhmm(a.open_since)}))]),
    el("td", {}, a.final_tokens === null ? copy.unavailable : Number(a.final_tokens).toLocaleString()),
  ]);
}

/* Running agents first by start, then finished ones newest first; the newest
   PAGE.finished_shown finished ones unless the list is expanded. */
function agentTable(agents, nowMs, key) {
  if (!agents.length) {
    return el("p", {"class": "empty"}, copy.agents_empty);
  }
  const open = agents.filter((a) => a.ended_at === null)
    .sort((a, b) => cmp(a.started_at || "", b.started_at || ""));
  const done = agents.filter((a) => a.ended_at !== null).sort((a, b) => cmp(b.ended_at, a.ended_at));
  const id = "agents:" + key;
  const all = ui.expanded.has(id);
  const table = grid("", [
    copy.agent_name, copy.agent_mode, copy.agent_state, copy.agent_model, copy.agent_started,
    copy.agent_duration, copy.agent_tools, copy.agent_last_tool, copy.agent_open_tool, copy.final_context,
  ], [...open, ...(all ? done : done.slice(0, PAGE.finished_shown))].map((a) => agentRow(a, nowMs)));
  if (done.length <= PAGE.finished_shown) {
    return table;
  }
  const button = el("button", {"type": "button", "aria-expanded": String(all), "data-key": id},
    all ? copy.show_fewer : fmt(copy.show_all, {n: agents.length}));
  button.addEventListener("click", () => {
    if (all) {
      ui.expanded.delete(id);
    } else {
      ui.expanded.add(id);
    }
    render();
  });
  return el("div", {}, [table, button]);
}

function gateTable(logs) {
  if (!logs.length) {
    return el("p", {"class": "empty"}, copy.gates_empty);
  }
  return grid("", [copy.gate_log, copy.gate_sha, copy.gate_dirty, copy.gate_exit, copy.gate_harness],
    logs.map((row) => el("tr", {}, [
      el("td", {"class": "mono"}, shown(row.log)),
      el("td", {"class": "mono"}, shown(row.sha)),
      el("td", {}, shown(row.dirty)),
      el("td", {}, shown(row.exit)),
      el("td", {}, shown(row.harness)),
    ])));
}

/* Everything below a run's header: report error, stages, budget, board, graph, agents, gates.
   ended: the state lists the run under ended, whose files may be gone when it has no report. */
function runSections(run, nowMs, key, ended) {
  const rep = run.report;
  const out = [];
  if (run.report_error !== null) {
    out.push(el("p", {"class": "error"}, run.report_error));
  }
  if (rep) {
    out.push(el("h3", {}, copy.stages_heading), stageStrip(rep.stages));
  } else if (!ended) {
    out.push(el("p", {"class": "empty"}, copy.no_report));
  } else if (run.report_error === null) {
    out.push(el("p", {"class": "empty"}, copy.files_not_kept));
  }
  out.push(budgetPanel(run.budget));
  if (rep) {
    out.push(el("h3", {}, copy.board_heading), laneBoard(rep, run.lanes));
    out.push(el("h3", {}, copy.graph_heading), waveGraph(rep, run.lanes));
  }
  out.push(el("h3", {}, copy.agents_heading), agentTable(run.agents, nowMs, key));
  if (rep) {
    out.push(el("h3", {}, copy.gates_heading), gateTable(rep.gate_logs));
  }
  return out;
}

function renderRoute(s, root, key) {
  const r = s.routes.find((x) => x.key === key) || s.idle.find((x) => x.key === key);
  if (!r) {
    root.append(el("p", {"class": "empty"}, copy.route_missing), link("", copy.overview_link, "overview"));
    return;
  }
  const run = r.run;
  root.append(el("div", {"class": "detail-head"}, [
    el("h2", {}, r.name),
    el("div", {"class": "chips"}, [chip("route_status", r.status), ...runChips(run)]),
  ]));
  if (run.recording_hint !== null) {
    root.append(el("p", {"class": "hint"}, run.recording_hint));
  }
  root.append(...runSections(run, Date.now(), r.key, false));
}

/* --- ended routes and an ended run's read-only detail */

function renderEnded(s, root) {
  root.append(el("h2", {}, copy.ended_heading));
  if (!s.ended.length) {
    root.append(el("p", {"class": "empty"}, copy.ended_empty));
  }
  for (const r of s.ended) {
    root.append(el("section", {"class": "ended"}, [
      el("h3", {}, r.name),
      el("p", {"class": "muted mono"}, r.planning_dir),
      grid("", [copy.run_col, copy.first_seen, copy.last_active, copy.sessions, copy.agent_count,
        copy.recording_col, copy.report_col], r.runs.map((x) => el("tr", {}, [
        el("td", {"class": "mono"}, [link("run/" + encodeURIComponent(x.key), shown(x.run === null ? x.key : x.run),
          "run:" + x.key)]),
        el("td", {}, stamp(x.first_seen_at)),
        el("td", {}, stamp(x.last_activity_at)),
        el("td", {}, shown(x.sessions)),
        el("td", {}, shown(x.agents)),
        el("td", {}, [chip("recording", x.recording)]),
        el("td", {}, x.has_report ? copy.report_kept : copy.files_not_kept),
      ]))),
    ]));
  }
}

/* The ended entry listing the run with this key, and its route; null when none does. */
function endedRun(s, key) {
  for (const r of s.ended) {
    const hit = r.runs.find((x) => x.key === key);
    if (hit) {
      return {route: r, run: hit};
    }
  }
  return null;
}

/* The run's cached /api/run answer, fetched when absent or fetched at another rev. */
function loadRun(key, rev) {
  const have = runs.get(key);
  if (have && (have.busy || have.rev === rev)) {
    return have;
  }
  const entry = {rev: rev, body: have ? have.body : null, busy: true, failed: false};
  runs.set(key, entry);
  const ctl = new AbortController();
  const abort = setTimeout(() => ctl.abort(), PAGE.abort_ms);
  fetch("/api/run?key=" + encodeURIComponent(key), {signal: ctl.signal, cache: "no-store"})
    .then((res) => {
      if (!res.ok) {
        throw new Error(String(res.status));
      }
      return res.json();
    })
    .then((body) => {
      entry.body = body;
    })
    .catch(() => {
      entry.failed = true;
    })
    .finally(() => {
      clearTimeout(abort);
      entry.busy = false;
      render();
    });
  return entry;
}

function renderRun(s, root, key) {
  const hit = endedRun(s, key);
  const entry = loadRun(key, hit ? hit.run.rev : null);
  if (!entry.body) {
    root.append(el("p", {"class": entry.failed ? "error" : "empty"}, entry.failed ? copy.run_failed : copy.run_loading));
    root.append(link("ended", fmt(copy.ended_link, {n: s.counts.ended}), "ended"));
    return;
  }
  const run = entry.body.run;
  root.append(el("div", {"class": "detail-head"}, [
    el("h2", {}, entry.body.route.name),
    el("div", {"class": "chips"}, [chip("run_state", run.state), ...runChips(run)]),
  ]));
  root.append(el("p", {"class": "muted mono"}, entry.body.route.planning_dir));
  if (hit) {
    root.append(el("p", {"class": "hint"}, fmt(copy.ended_run, {
      date: stamp(run.last_activity_at),
      files_as_of: stamp(run.files_as_of),
    })));
  }
  if (run.recording_hint !== null) {
    root.append(el("p", {"class": "hint"}, run.recording_hint));
  }
  root.append(...runSections(run, Date.now(), "run:" + key, Boolean(hit)));
}

/* --- rendering: one view per hash, focus kept on the element with the same data-key */

function decoded(text) {
  try {
    return decodeURIComponent(text);
  } catch {
    return text;
  }
}

function viewFor(hash) {
  if (hash.startsWith(ROUTE_PREFIX)) {
    const key = decoded(hash.slice(ROUTE_PREFIX.length));
    return (s, root) => renderRoute(s, root, key);
  }
  if (hash.startsWith(RUN_PREFIX)) {
    const key = decoded(hash.slice(RUN_PREFIX.length));
    return (s, root) => renderRun(s, root, key);
  }
  if (hash === ENDED_HASH) {
    return renderEnded;
  }
  return renderOverview;
}

function render() {
  const s = poll.state;
  if (!s) {
    return;
  }
  const active = document.activeElement;
  const focused = active && active.dataset ? active.dataset.key : undefined;
  const root = document.getElementById("view");
  root.replaceChildren();
  viewFor(location.hash)(s, root);
  if (focused !== undefined) {
    for (const node of root.querySelectorAll("[data-key]")) {
      if (node.dataset.key === focused) {
        node.focus();
        break;
      }
    }
  }
}

/* --- polling: one request in flight, the next one scheduled after it completes */

function delay() {
  if (poll.failures) {
    const steps = PAGE.backoff_ms;
    return steps[Math.min(poll.failures, steps.length) - 1];
  }
  return document.hidden ? PAGE.poll_hidden_ms : PAGE.poll_visible_ms;
}

function schedule() {
  clearTimeout(poll.timer);
  poll.timer = setTimeout(tick, delay());
}

async function tick() {
  if (poll.busy) {
    return;
  }
  clearTimeout(poll.timer);
  poll.busy = true;
  const ctl = new AbortController();
  const abort = setTimeout(() => ctl.abort(), PAGE.abort_ms);
  try {
    const res = await fetch("/api/state", {signal: ctl.signal, cache: "no-store"});
    if (!res.ok) {
      throw new Error(String(res.status));
    }
    const text = await res.text();
    poll.failures = 0;
    poll.failedAt = null;
    if (text !== poll.text) {
      const s = JSON.parse(text);
      poll.text = text;
      poll.state = s;
      poll.first = poll.first || {version: s.version, page: s.page};
      render();
    }
  } catch {
    poll.failures += 1;
    poll.failedAt = poll.failedAt || new Date().toISOString();
  } finally {
    clearTimeout(abort);
    poll.busy = false;
    renderChrome();
    schedule();
  }
}

function refreshNow() {
  if (!poll.busy) {
    tick();
  }
}

/* A view opened: a run whose fetch failed is fetched again. */
function opened() {
  for (const [key, entry] of runs) {
    if (entry.failed) {
      runs.delete(key);
    }
  }
  render();
}

/* --- keyboard: navigation clicks a detached same-page link */

function go(path) {
  const a = document.createElement("a");
  a.setAttribute("href", "#/" + path);
  a.click();
}

/* Focus the next (step 1) or previous (step -1) visible element with a data-key. */
function move(step) {
  const nodes = [...document.querySelectorAll("[data-key]")].filter((n) => n.getClientRects().length);
  if (!nodes.length) {
    return;
  }
  const i = nodes.indexOf(document.activeElement);
  const next = i < 0 ? (step > 0 ? 0 : nodes.length - 1) : Math.min(Math.max(i + step, 0), nodes.length - 1);
  nodes[next].focus();
}

function openRoute(n) {
  const r = poll.state ? poll.state.routes[n] : undefined;
  if (r) {
    go("r/" + encodeURIComponent(r.key));
  }
}

const KEYS = {
  "o": () => go(""),
  "Escape": () => go(""),
  "e": () => go("ended"),
  "j": () => move(1),
  "k": () => move(-1),
  "r": refreshNow,
  "t": cycleTheme,
  "?": toggleSheet,
};
const DIGITS = "123456789";

/* Enter is left to the focused link or button; no shortcut fires with a modifier held
   or while focus is in an editable element. */
function onKey(e) {
  const t = e.target;
  if (e.ctrlKey || e.altKey || e.metaKey || e.defaultPrevented
    || (t instanceof Element && (t.isContentEditable || t.closest("input, textarea, select")))) {
    return;
  }
  const n = e.key.length === 1 ? DIGITS.indexOf(e.key) : -1;
  if (n >= 0) {
    openRoute(n);
  } else if (Object.hasOwn(KEYS, e.key)) {
    KEYS[e.key]();
  } else {
    return;
  }
  e.preventDefault();
}

buildHeader();
applyTheme(storedTheme());
window.addEventListener("hashchange", opened);
document.addEventListener("keydown", onKey);
document.addEventListener("visibilitychange", () => {
  if (!poll.busy) {
    schedule();
  }
});
tick();
</script>
</body>
</html>
